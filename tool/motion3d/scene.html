<script type="module">
// 3D 动作示范场景：Quaternius Universal Base Characters（CC0）人体，哑光雕塑材质，发力肌肉着橙色。
// 由 render.cjs 驱动：window.renderAt(t) 画出第 t 秒的姿势，window.meta 给 App 节奏信息。
// 页面参数：ex 动作、size 画布边长、bg 不透明底色（RRGGBB，不传则透明）、yaw 覆盖机位水平角、shadow=0 不画地面阴影。
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const size = +(q.get('size') || 640);
const MODEL = '/out/models/quaternius-ubc/Universal Base Characters[Standard]/Base Characters/Godot - UE/';
const rad = THREE.MathUtils.degToRad;
const X = new THREE.Vector3(1, 0, 0);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

// ---------------------------------------------------------------- 渲染器、灯光
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(size, size);
const bg = q.get('bg');
renderer.setClearColor(bg ? new THREE.Color('#' + bg) : 0x000000, bg ? 1 : 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);

const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(2.2, 4, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 6;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
Object.assign(key.shadow.camera, { left: -2, right: 2, top: 2.5, bottom: -1, near: 0.5, far: 12 });
scene.add(key);
// 轮廓光：从背后打亮边缘，把人从背景里分出来；冷色补光压一点暗部。
const rim = new THREE.DirectionalLight(0xfff1e6, 1.4);
rim.position.set(-2.5, 2.6, -3);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.35);
fill.position.set(-3, 1.2, 2);
scene.add(fill);

// ---------------------------------------------------------------- 模型
const gltf = await new GLTFLoader().loadAsync(MODEL + 'Superhero_Male_FullBody.gltf');
const root = gltf.scene;
scene.add(root);
let body;
root.traverse(o => {
  if (!o.isMesh) return;
  o.visible = false;
  if (!body || o.geometry.attributes.position.count > body.geometry.attributes.position.count) body = o;
});
body.visible = true;
body.castShadow = true;
body.receiveShadow = true;
root.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(body);
const bones = {};
body.skeleton.bones.forEach(b => (bones[b.name] = b));

// ---------------------------------------------------------------- 材质与肌肉发光
// 发光两种来源取最大：① 骨头：按蒙皮权重，前侧/后侧各一个强度（看绑定姿势下法线朝前还是朝后）；
// ② 球形区域：绑定姿势下的位置落在球里就亮，边缘柔和衰减（三角肌、胸这类不跟整根骨头走的肌肉）。
const N = body.skeleton.bones.length, S = 8;
const glow = {
  uFront: { value: new Float32Array(N) },
  uBack: { value: new Float32Array(N) },
  uSph: { value: Array.from({ length: S }, () => new THREE.Vector4(0, -9, 0, 0.001)) },
  uSphW: { value: new Float32Array(S) },
  uLevel: { value: 0 },
  uTint: { value: new THREE.Color(0xff6a13) },
  uBindM: { value: body.matrixWorld.clone() },
};
const mat = new THREE.MeshStandardMaterial({
  color: 0xb8b0a7, roughness: 0.62, metalness: 0,
  normalMap: body.material.normalMap || null, envMapIntensity: 0.5,
});
mat.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, glow);
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', `#include <common>
      uniform float uFront[${N}]; uniform float uBack[${N}];
      uniform vec4 uSph[${S}]; uniform float uSphW[${S}];
      uniform mat4 uBindM; varying float vGlow;`)
    .replace('#include <begin_vertex>', `#include <begin_vertex>
      float side = smoothstep(-0.3, 0.3, (mat3(uBindM) * normal).z);
      vGlow = 0.0;
      for (int i = 0; i < 4; i++) {
        int b = int(skinIndex[i]);
        vGlow += skinWeight[i] * mix(uBack[b], uFront[b], side);
      }
      vec3 bp = (uBindM * vec4(position, 1.0)).xyz;
      for (int i = 0; i < ${S}; i++) {
        float d = distance(bp, uSph[i].xyz);
        vGlow = max(vGlow, uSphW[i] * (1.0 - smoothstep(uSph[i].w * 0.45, uSph[i].w, d)));
      }`);
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>
      uniform float uLevel; uniform vec3 uTint; varying float vGlow;`)
    .replace('#include <color_fragment>', `#include <color_fragment>
      float gl = clamp(vGlow * uLevel, 0.0, 1.0);
      diffuseColor.rgb = mix(diffuseColor.rgb, uTint, gl * 0.85);`)
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      totalEmissiveRadiance += uTint * clamp(vGlow * uLevel, 0.0, 1.0) * 0.28;`);
};
body.material = mat;

const ground = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = box.min.y;
ground.receiveShadow = true;
if (q.get('shadow') !== '0') scene.add(ground);

// 哑铃：深灰金属，握把沿世界前后方向（侧平举的中立握法）。
const metal = new THREE.MeshStandardMaterial({ color: 0x3a3a3e, roughness: 0.35, metalness: 0.6, envMapIntensity: 0.8 });
function dumbbell() {
  const g = new THREE.Group();
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.16, 20), metal);
  g.add(bar);
  for (const s of [-1, 1]) {
    const plate = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.05, 32), metal);
    plate.position.y = s * 0.085;
    g.add(plate);
  }
  g.traverse(o => o.isMesh && (o.castShadow = true));
  g.visible = false;
  scene.add(g);
  return g;
}
const bells = { l: dumbbell(), r: dumbbell() };
// 桌台（高位俯卧撑）：哑光浅灰块，比影棚底略深。
const table = new THREE.Mesh(
  new THREE.BoxGeometry(0.9, 0.04, 0.34),
  new THREE.MeshStandardMaterial({ color: 0xa9a29a, roughness: 0.7, envMapIntensity: 0.4 }),
);
table.castShadow = table.receiveShadow = true;
table.visible = false;
scene.add(table);
const tableLegs = [-1, 1].map(k => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1, 0.05), table.material);
  m.castShadow = true;
  m.visible = false;
  scene.add(m);
  return m;
});

// ---------------------------------------------------------------- 骨骼工具
const bind = new Map();
body.skeleton.bones.forEach(b => bind.set(b, { q: b.quaternion.clone(), p: b.position.clone() }));
const wpos = b => (b.updateWorldMatrix(true, false), b.getWorldPosition(V()));
const wquat = b => b.getWorldQuaternion(new THREE.Quaternion());
const bindPos = {}, bindQuat = {};
for (const n of Object.keys(bones)) { bindPos[n] = wpos(bones[n]); bindQuat[n] = wquat(bones[n]); }
const L = {
  thigh: bindPos.thigh_l.distanceTo(bindPos.calf_l), shin: bindPos.calf_l.distanceTo(bindPos.foot_l),
  uarm: bindPos.upperarm_l.distanceTo(bindPos.lowerarm_l), farm: bindPos.lowerarm_l.distanceTo(bindPos.hand_l),
};

function setWorldQuat(bone, wq) {
  bone.quaternion.copy(wquat(bone.parent).invert().multiply(wq));
  bone.updateWorldMatrix(false, true);
}
function rotWorld(bone, axis, deg) {
  setWorldQuat(bone, new THREE.Quaternion().setFromAxisAngle(axis, rad(deg)).multiply(wquat(bone)));
}
function setWorldPos(bone, p) {
  bone.position.copy(bone.parent.worldToLocal(p.clone()));
  bone.updateWorldMatrix(false, true);
}
// 转动 bone，让它的子骨头 child 落到 target（世界坐标）。
function aim(bone, child, target) {
  const bp = wpos(bone), cp = wpos(child);
  const d = new THREE.Quaternion().setFromUnitVectors(cp.sub(bp).normalize(), target.clone().sub(bp).normalize());
  setWorldQuat(bone, d.multiply(wquat(bone)));
}
// 两段式 IK：根 a、中 b、末 c，末端到 target，中间关节朝 pole 方向弯。
function twoBone(a, b, c, target, pole, l1, l2) {
  const ap = wpos(a);
  const toT = target.clone().sub(ap);
  const d = THREE.MathUtils.clamp(toT.length(), Math.abs(l1 - l2) + 1e-4, l1 + l2 - 1e-4);
  const u = toT.normalize();
  const v = pole.clone().normalize().sub(u.clone().multiplyScalar(pole.clone().normalize().dot(u))).normalize();
  const cos = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
  const mid = ap.clone().add(u.clone().multiplyScalar(l1 * cos)).add(v.multiplyScalar(l1 * Math.sqrt(Math.max(0, 1 - cos * cos))));
  aim(a, b, mid);
  aim(b, c, ap.clone().add(u.clone().multiplyScalar(d)));
}
// 手掌朝下、手指指向 dir（绑定姿势是 T 字、掌心朝下，绕竖直轴转过去即可）。
function palm(s, dir) {
  const k = s === 'l' ? 1 : -1;
  const turn = new THREE.Quaternion().setFromUnitVectors(V(k, 0, 0), dir.clone().normalize());
  setWorldQuat(bones['hand_' + s], turn.multiply(bindQuat['hand_' + s].clone()));
}
function reset() {
  for (const [b, s] of bind) { b.quaternion.copy(s.q); b.position.copy(s.p); }
  root.updateMatrixWorld(true);
}

// ---------------------------------------------------------------- 三种姿势模式
// 站立（深蹲、侧平举）：drop 骨盆下沉、back 后移、lean 躯干前倾；脚踩在原地。
// 手臂 front：arm 前举角（0 垂下、90 平举）、el 肘再往前屈；手臂 side：abd 外展角、el 肘微屈（向前）。
function poseStand(spec, v) {
  // 抬脚跟时脚踝上升并前移：骨盆跟着走，膝盖才不会被顶弯。
  let rise = 0, shift = 0;
  if (v.heel && !spec.stance) {
    const th0 = Math.asin(Math.min(0.99, v.heel / 0.16));
    const off = V(0, bindPos.ball_l.y - bindPos.foot_l.y, bindPos.ball_l.z - bindPos.foot_l.z).applyAxisAngle(X, th0);
    rise = bindPos.ball_l.y - off.y - bindPos.foot_l.y;
    shift = bindPos.ball_l.z - off.z - bindPos.foot_l.z;
  }
  setWorldPos(bones.pelvis, bindPos.pelvis.clone().add(V(0, -(v.drop || 0) + rise, -(v.back || 0) + shift)));
  // tilt：骨盆整体前倾（髋铰链），脊柱 lean 是在此之上再弯的角度。
  if (v.tilt) rotWorld(bones.pelvis, X, v.tilt);
  for (const n of ['spine_01', 'spine_02', 'spine_03']) rotWorld(bones[n], X, (v.lean || 0) / 3);
  // 头颈：回正抵消躯干前倾，视线大致朝前（headUp 额外抬头）。
  rotWorld(bones.neck_01, X, -((v.lean || 0) + (v.tilt || 0)) * 0.55 - (v.headUp || 0));
  for (const s of ['l', 'r']) {
    const k = s === 'l' ? 1 : -1;
    // 脚：默认原地；spec.stance 给前后站位；heel（米）抬脚跟，脚掌前部（ball）始终踩在地面。
    const st = spec.stance?.[s];
    const heel = v['heel' + s.toUpperCase()] ?? v.heel ?? st?.[2] ?? 0;
    const bx = st ? k * st[0] : bindPos['foot_' + s].x, bz = st ? st[1] : bindPos['foot_' + s].z + 0.0;
    const th = Math.asin(Math.min(0.99, heel / 0.16));
    const ballOff = V(0, bindPos['ball_' + s].y - bindPos['foot_' + s].y, bindPos['ball_' + s].z - bindPos['foot_' + s].z);
    const rotated = ballOff.clone().applyAxisAngle(X, th);
    const ballGround = V(bx, bindPos['ball_' + s].y, bindPos['ball_' + s].z + (st ? bz - bindPos['foot_' + s].z : 0));
    const ankleT = ballGround.clone().sub(rotated);
    twoBone(bones['thigh_' + s], bones['calf_' + s], bones['foot_' + s], ankleT, V(0.22 * k, 0, 1), L.thigh, L.shin);
    setWorldQuat(bones['foot_' + s], new THREE.Quaternion().setFromAxisAngle(X, th).multiply(bindQuat['foot_' + s].clone()));
    const sh = wpos(bones['upperarm_' + s]);
    if (spec.arms === 'ik') {
      // 手到指定位置：hx 距中线、hy 高度、hz 向前（米，世界坐标，右手取反）；肘朝 pole 方向弯。
      const hx = (v['hx' + s.toUpperCase()] ?? v.hx), hy = (v['hy' + s.toUpperCase()] ?? v.hy), hz = (v['hz' + s.toUpperCase()] ?? v.hz);
      const pole = V((spec.pole?.[0] ?? 0.7) * k, spec.pole?.[1] ?? -0.7, spec.pole?.[2] ?? -0.2);
      twoBone(bones['upperarm_' + s], bones['lowerarm_' + s], bones['hand_' + s], V(k * hx, hy, hz), pole, L.uarm, L.farm);
      continue;
    }
    let dir, dir2;
    if (spec.arms === 'side') {
      const a = rad(v.abd), e = rad(v.el);
      dir = V(k * Math.sin(a), -Math.cos(a), 0.06).normalize();
      dir2 = V(k * Math.sin(a) * Math.cos(e), -Math.cos(a) * Math.cos(e), Math.sin(e) + 0.06).normalize();
    } else {
      dir = V(0.12 * k, -Math.cos(rad(v.arm)), Math.sin(rad(v.arm))).normalize();
      dir2 = V(0.06 * k, -Math.cos(rad(v.arm + v.el)), Math.sin(rad(v.arm + v.el))).normalize();
    }
    const elbow = sh.clone().add(dir.multiplyScalar(L.uarm));
    aim(bones['upperarm_' + s], bones['lowerarm_' + s], elbow);
    aim(bones['lowerarm_' + s], bones['hand_' + s], elbow.clone().add(dir2.multiplyScalar(L.farm)));
  }
}

// 俯卧（俯卧撑）：以脚尖为支点整块转动，lean 是身体与地面的夹角；手掌平放在固定位置，肘朝后外。
function poseProne(spec, v) {
  rotWorld(bones.pelvis, X, 90 - v.lean);
  // 平移骨盆，让左踝落到支点。
  const ankle = wpos(bones.foot_l);
  setWorldPos(bones.pelvis, wpos(bones.pelvis).add(V(bindPos.foot_l.x, spec.ankle[0], spec.ankle[1]).sub(ankle)));
  rotWorld(bones.neck_01, X, v.neck || 0);
  for (const s of ['l', 'r']) {
    const k = s === 'l' ? 1 : -1;
    rotWorld(bones['foot_' + s], X, spec.foot);
    const hand = V(k * spec.hand[0], spec.hand[1], spec.hand[2]);
    const pole = spec.pole ? V(spec.pole[0] * k, spec.pole[1], spec.pole[2]) : V(0.75 * k, 0.5, -1);
    twoBone(bones['upperarm_' + s], bones['lowerarm_' + s], bones['hand_' + s], hand, pole, L.uarm, L.farm);
    palm(s, V(0.1 * k, 0, 1));
  }
}

// 仰卧（臀桥、死虫式、卷腹类）：肩背在 spec.shoulder 处贴地，hip 是骨盆离地高度；
// 躯干从肩指向骨盆。腿二选一：feet（脚踩地，IK 定膝，膝朝上）或 legs（hipFlex 屈髋、knee 屈膝，悬空）。
// 手臂：armUp 从身侧（0）往头顶方向抬的角度（90 指向天花板）。curl 卷腹抬肩的角度。
function poseSupine(spec, v) {
  const shoulder = V(0, spec.shoulder[0], spec.shoulder[1]);
  // 先整体转成仰卧：头朝 -z，正面朝上。
  rotWorld(bones.pelvis, X, -90);
  const hip = V(0, v.hip, shoulder.z + 0.5 * Math.cos(Math.asin(Math.min(0.95, (v.hip - shoulder.y) / 0.5))));
  setWorldPos(bones.pelvis, hip);
  // 躯干对准肩部支点（用左右上臂中点代表肩）。
  const shMid = wpos(bones.upperarm_l).add(wpos(bones.upperarm_r)).multiplyScalar(0.5);
  const turn = new THREE.Quaternion().setFromUnitVectors(shMid.sub(hip).normalize(), shoulder.clone().sub(hip).normalize());
  setWorldQuat(bones.pelvis, turn.multiply(wquat(bones.pelvis)));
  if (v.curl) for (const n of ['spine_02', 'spine_03']) rotWorld(bones[n], X, -v.curl / 2);
  // 头平躺：颈部把头摆回水平（朝 -z），再按 neck 抬起（卷腹时下巴微收）。
  const neck = wpos(bones.neck_01), headLen = neck.distanceTo(wpos(bones.Head));
  const lift = rad(v.neck || 0);
  aim(bones.neck_01, bones.Head, neck.clone().add(V(0, Math.sin(lift), -Math.cos(lift)).multiplyScalar(headLen)));
  for (const s of ['l', 'r']) {
    const k = s === 'l' ? 1 : -1;
    const side = s === 'l' ? 'L' : 'R';
    const hipF = v['hipFlex' + side] ?? v.hipFlex, knee = v['knee' + side] ?? v.knee;
    if (spec.feet) {
      const foot = V(k * spec.feet[0], spec.feet[1], spec.feet[2]);
      twoBone(bones['thigh_' + s], bones['calf_' + s], bones['foot_' + s], foot, V(0.15 * k, 1, 0.3), L.thigh, L.shin);
      setWorldQuat(bones['foot_' + s], bindQuat['foot_' + s].clone());
    } else {
      // 大腿方向：从躯干延长线（0）往天花板转 hipF；小腿再往回折 knee。
      const th = wpos(bones['thigh_' + s]);
      const a = rad(hipF), b = rad(hipF - knee);
      const d1 = V(0.04 * k, Math.sin(a), Math.cos(a)), d2 = V(0.02 * k, Math.sin(b), Math.cos(b));
      const kneeP = th.clone().add(d1.multiplyScalar(L.thigh));
      aim(bones['thigh_' + s], bones['calf_' + s], kneeP);
      aim(bones['calf_' + s], bones['foot_' + s], kneeP.clone().add(d2.multiplyScalar(L.shin)));
    }
    const up = v['armUp' + side] ?? v.armUp ?? 0;
    if (up < 1) {
      // 手臂平放在身侧地面，掌心朝下。
      twoBone(bones['upperarm_' + s], bones['lowerarm_' + s], bones['hand_' + s], V(k * 0.33, 0.035, shoulder.z + 0.46), V(k, -0.4, 0), L.uarm, L.farm);
      palm(s, V(0.15 * k, 0, 1));
    } else {
      const sh = wpos(bones['upperarm_' + s]);
      const dir = V(0.12 * k, Math.sin(rad(up)), Math.cos(rad(up))).normalize();
      const elbow = sh.clone().add(dir.clone().multiplyScalar(L.uarm));
      aim(bones['upperarm_' + s], bones['lowerarm_' + s], elbow);
      aim(bones['lowerarm_' + s], bones['hand_' + s], elbow.clone().add(dir.multiplyScalar(L.farm)));
    }
  }
}

// ---------------------------------------------------------------- 动作库
// keys：[秒, 姿势, 发力程度, 阶段名]；最后一帧只标结束时间（回到第一帧）。
// glow：骨头名 → [前侧, 后侧]；spheres：[x, y, z, 半径, 强度]（绑定姿势、世界坐标、米）。
// camera：yaw 水平角、dist 距离（身高倍数）、target 注视点、fov。
const LIB = {
  squat: {
    mode: 'stand', arms: 'front',
    base: { drop: 0.015, back: 0, lean: 4, arm: 10, el: 14 },
    keys: [
      [0, {}, 0.15, '起始'], [0.5, {}, 0.55, '下放'],
      [2.5, { drop: 0.42, back: 0.17, lean: 40, arm: 86, el: 4 }, 0.8, '停顿'],
      [2.8, { drop: 0.42, back: 0.17, lean: 40, arm: 86, el: 4 }, 1, '发力'],
      [4.0],
    ],
    glow: { thigh_l: [1, 0.25], thigh_r: [1, 0.25], pelvis: [0, 0.95], spine_01: [0, 0.2] },
    camera: { yaw: 55, dist: 2.05, target: [0, 0.83, -0.07], fov: 28 },
  },
  pushup: {
    mode: 'prone', ankle: [0.11, -0.66], foot: -62, hand: [0.27, 0.035, 0.64],
    base: { lean: 18, neck: -6 },
    keys: [
      [0, {}, 0.2, '起始'], [0.3, {}, 0.6, '下放'],
      [2.1, { lean: 4 }, 0.85, '停顿'],
      [2.4, { lean: 4 }, 1, '发力'],
      [3.6],
    ],
    glow: { upperarm_l: [0.2, 0.85], upperarm_r: [0.2, 0.85] },
    spheres: [[0.1, 1.33, 0.09, 0.15, 1], [-0.1, 1.33, 0.09, 0.15, 1], [0.2, 1.43, 0.03, 0.09, 0.7], [-0.2, 1.43, 0.03, 0.09, 0.7]],
    camera: { yaw: 60, dist: 1.85, target: [0, 0.22, 0.28], fov: 28 },
  },
  'lateral-raise': {

  glow.uFront.value[i] = f;
  glow.uBack.value[i] = b;
}
(spec.spheres || []).slice(0, S).forEach(([x, y, z, r, w], i) => {
  glow.uSph.value[i].set(x, y, z, r);
  glow.uSphW.value[i] = w;
});

if (spec.table) {
  const [ty, tz] = spec.table;
  table.visible = true;
  table.position.set(0, ty - 0.02, tz);
  tableLegs.forEach((m, i) => {
    m.visible = true;
    m.scale.y = ty - 0.04;
    m.position.set((i ? 1 : -1) * 0.4, (ty - 0.04) / 2, tz);
  });
}

// 机位
const h = box.max.y - box.min.y;
const cam = spec.camera;
const yaw = rad(q.has('yaw') ? +q.get('yaw') : cam.yaw);
const [tx, ty, tz] = cam.target;
camera.fov = cam.fov;
camera.updateProjectionMatrix();
camera.position.set(tx + Math.sin(yaw) * h * cam.dist, ty + h * 0.08, tz + Math.cos(yaw) * h * cam.dist);
camera.lookAt(tx, ty, tz);

// ---------------------------------------------------------------- 播放
const ease = u => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
function sample(t) {
  const K = spec.keys, P = K[K.length - 1][0];
  t = ((t % P) + P) % P;
  let i = 0;
  while (i < K.length - 2 && K[i + 1][0] <= t) i++;
  const [t0, v0 = {}, l0] = K[i], [t1, v1 = {}] = K[i + 1];
  const e = ease(Math.min(1, (t - t0) / (t1 - t0)));
  const v = {};
  for (const k of Object.keys(spec.base)) {
    const a = v0[k] ?? spec.base[k], b = v1[k] ?? spec.base[k];
    v[k] = a + (b - a) * e;
  }
  // 发力程度按段给，段与段之间 0.25 秒内平滑过渡。
  const prev = K[(i - 1 + K.length - 1) % (K.length - 1)][2];
  const bl = Math.min(1, (t - t0) / 0.25);
  return { v, load: prev + (l0 - prev) * bl * bl * (3 - 2 * bl) };
}
function placeBells() {
  if (!spec.props) return;
  if (spec.props === 'goblet') {
    // 一个哑铃竖着托在胸前，两手托住上端。
    const a = wpos(bones.hand_l), b = wpos(bones.hand_r);
    bells.l.visible = true;
    bells.r.visible = false;
    bells.l.position.copy(a.add(b).multiplyScalar(0.5)).add(V(0, -0.03, 0.0));
    bells.l.quaternion.identity();
    bells.l.scale.setScalar(1.55);
    return;
  }
  for (const s of ['l', 'r']) {
    const hand = wpos(bones['hand_' + s]), mid = wpos(bones['middle_01_' + s]);
    const grip = hand.clone().add(mid.sub(hand).multiplyScalar(0.8)).add(V(0, -0.025, 0));
    bells[s].position.copy(grip);
    const axis = spec.bellAxis === 'x' ? V(1, 0, 0) : spec.bellAxis === 'y' ? V(0, 1, 0) : V(0, 0, 1);
    bells[s].quaternion.setFromUnitVectors(V(0, 1, 0), axis);
  }
}

window.period = spec.keys[spec.keys.length - 1][0];
window.meta = {
  period: window.period,
  phases: spec.keys.slice(0, -1).map(k => [k[0], k[3]]),
  // still：减少动态效果时停的那一刻；不写就取发力最大那段的开头。
  peak: spec.still ?? spec.keys.slice(0, -1).reduce((a, k) => (k[2] > a[2] ? k : a))[0] + 0.05,
};
window.renderAt = t => {
  const { v, load } = sample(t);
  reset();
  ({ prone: poseProne, supine: poseSupine, stand: poseStand })[spec.mode](spec, v);
  root.updateMatrixWorld(true);
  placeBells();
  glow.uLevel.value = 0.2 + 0.8 * load;
  renderer.render(scene, camera);
};
window.ready = true;
