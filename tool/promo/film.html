const FPS=30;

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,t)=>a+(b-a)*t;

 eio:x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}, expo:x=>x>=1?1:1-Math.pow(2,-10*clamp(x))};
const $=id=>document.getElementById(id);
const pad=(n,w=5)=>String(n).padStart(w,'0');

// ---------- 通用：遮罩升起、退出、扫光

function exitBlur(id,k,dy=-60){const e=$(id);e.style.opacity=1-k;e.style.filter=k>0?`blur(${k*14}px)`:'none';e.style.transform=k>0?`translateY(${k*dy}px) scale(${1+k*.08})`:'none'}
function glint(id,t,t0,dur=.7){const e=$(id),k=(t-t0)/dur;e.style.opacity=k>0&&k<1?1:0;e.style.webkitMaskPosition=`${(1-clamp(k))*100}% 0`}
function resetLine(id){const e=$(id);e.style.opacity=1;e.style.filter='none';e.style.transform='none'}

// ---------- 氛围
const dust=[];let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let i=0;i<46;i++){const e=document.createElement('i');const z=rnd();dust.push({e,x:rnd()*1080,y:rnd()*1920,z,ph:rnd()*6.28});e.style.width=e.style.height=(2+z*5)+'px';e.style.filter=`blur(${(1-z)*2.2}px)`;$('dust').appendChild(e);}
function ambience(t,glow,dustOn){

 dust.forEach(d=>{const y=(d.y-t*(14+d.z*40)+1920*40)%1920,x=d.x+Math.sin(t*.6+d.ph)*20*d.z;d.e.style.transform=`translate(${x}px,${y}px)`;d.e.style.opacity=dustOn*(.25+.6*d.z)*(.5+.5*Math.sin(t*1.3+d.ph))});
 const g=Math.floor(t*FPS);$('grain').style.transform=`translate(${(g*37)%40}px,${(g*53)%40}px)`;
}

function segFrame(p,lt){ // 场景内时间 → 源帧号
 let acc=p.t0;for(const [f0,f1,sp] of p.segs){const d=(f1-f0)/FPS/sp;if(lt<acc)return f0;if(lt<acc+d)return Math.floor(f0+(lt-acc)*FPS*sp);acc+=d;}

function frameTime(p,f){let acc=p.t0;for(const [f0,f1,sp] of p.segs){if(f>=f0&&f<f1)return acc+(f-f0)/FPS/sp;acc+=(f1-f0)/FPS/sp;}return null}

 for(const k of ['tx','ty','rx','ry','s','cx','cy'])o[k]=lerp(a[k],b[k],t<a.t?0:u);
 return o;
}

 const [x,y,w,h,r]=L.r, card=$('card'), sh=$('cshadow');
 card.style.display=lift>0.0005?'block':'none';
 Object.assign(card.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',borderRadius:r+'px'});

 Object.assign(sh.style,{left:x+'px',top:(y+10)+'px',width:w+'px',height:h+'px',borderRadius:r+'px'});
 sh.style.opacity=lift*.5;sh.style.transform=`translate(${lift*10}px,${lift*26}px)`;
 $('dim').style.opacity=lift*.6;
 // H3 染色
 if(p.dye){const [d0,dd]=p.dye, dye=E.eio((lt-d0)/dd), gray=E.eio((lt-.5)/.7)*(dye>=1?0:1);
  $('s3').style.display='block';$('s3').style.opacity=gray;$('s3').style.clipPath=`inset(${dye*100}% 0 0 0)`;
  $('scan').style.top=(dye*h)+'px';$('scan').style.opacity=dye>0&&dye<1?1:0;
 } else {$('s3').style.display='none';$('scan').style.opacity=0}
 $('sheen').style.backgroundPosition=`${(-.3+((c.ry+40)/80)*1.6)*100}% 0`;
 // 点按
 p.taps.forEach(([f,tx,ty],i)=>{const tt=frameTime(p,f),d=tt==null?-1:lt-tt,k=clamp(d/.5),on=d>=0&&d<.5;
  for(const kk of ['s','c']){const e=ripEls[kk][i];const ox=kk==='c'?x:0,oy=kk==='c'?y:0;e.style.left=(tx-ox)+'px';e.style.top=(ty-oy)+'px';e.style.opacity=on?(1-k)*.95:0;e.style.transform=`scale(${.4+k*1.4})`}});
 for(let i=p.taps.length;i<4;i++)for(const kk of ['s','c'])ripEls[kk][i].style.opacity=0;
 return {c,lift};
}
function titles(p,lt){

}

async function hScene(key,lt){

 await phone(key,lt);$('cam').style.opacity=1;

async function clip(n,lt,count){
 const i=clamp(Math.floor(lt*FPS)+1,1,count);const u=`clip${n}/${pad(i,4)}.jpg`;
 if($('clip').dataset.u!==u){$('clip').dataset.u=u;$('clip').src=u;try{await $('clip').decode()}catch(e){}}
 $('clip').style.transform=`scale(${1+.05*lt/3})`;
}
window.render=async function(t){
 let acc=0,seg=CUT.at(-1),lt=0;
 for(const c of CUT){const d=c[2]-c[1];if(t<acc+d){seg=c;lt=c[1]+(t-acc);break;}acc+=d;}
 if(t>=TOTAL)lt=seg[2];
 for(const id of ['Lclip','LB','LP','LH','LC3','LD'])$(id).style.display='none';
 $('cam').style.display='none';$('fade').style.opacity=0;flare(0,0);$('glow').style.opacity=0;
 await SC[seg[0]](lt);
};
window.TOTAL=TOTAL;
window.render(0);
