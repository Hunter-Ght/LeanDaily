<!doctype html><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#050506;font-family:-apple-system,"SF Pro Display","PingFang SC","Hiragino Sans GB",sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;background:#050506}
#glow{position:absolute;left:-200px;top:500px;width:1480px;height:1480px;border-radius:50%;background:radial-gradient(circle,rgba(255,106,19,.30),rgba(255,106,19,0) 62%)}
#dust{position:absolute;inset:0}
#dust i{position:absolute;border-radius:50%;background:#ffb070}
.line{position:absolute;left:0;right:0;text-align:center;overflow:hidden;font-weight:900;letter-spacing:-4px;line-height:1.16;color:#fff;white-space:nowrap}
.line>span{display:block;will-change:transform}
#cam{position:absolute;inset:0;perspective:2600px;perspective-origin:540px 960px}
#world{position:absolute;left:540px;top:960px;width:0;height:0;transform-style:preserve-3d}
#phone{position:absolute;left:0;top:0;width:402px;height:874px;transform-style:preserve-3d}
#body{position:absolute;left:-11px;top:-11px;width:424px;height:896px;border-radius:68px;background:linear-gradient(135deg,#8a8a90,#3a3a3f 22%,#17171a 50%,#35353a 78%,#77777c);box-shadow:inset 0 0 0 1.5px #a9a9ae,inset 0 0 0 5px #0a0a0b}
#scr{position:absolute;left:0;top:0;width:402px;height:874px;border-radius:57px;overflow:hidden;background:#f2f2f7}
#scr img{position:absolute;left:0;top:0;width:402px;height:874px}
#dim{position:absolute;inset:0;background:#000;opacity:0}
#sheen{position:absolute;inset:0;background:linear-gradient(112deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.28) 50%,rgba(255,255,255,0) 65%);background-size:300% 100%}
#cshadow{position:absolute;left:16px;top:58px;width:370px;height:468px;border-radius:24px;background:#000;filter:blur(22px);opacity:0}
#card{position:absolute;left:16px;top:48px;width:370px;height:468px;border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 0 0 .6px rgba(0,0,0,.08),0 24px 60px rgba(0,0,0,.35)}
#card img{position:absolute;left:-16px;top:-48px;width:402px;height:874px}
.rip{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2.5px solid rgba(255,255,255,.95);background:rgba(255,106,19,.38);opacity:0}
#card img.gray{filter:grayscale(1) contrast(.85) brightness(1.08)}
#scan{position:absolute;left:-20px;right:-20px;top:0;height:44px;margin-top:-22px;background:linear-gradient(180deg,rgba(255,106,19,0),rgba(255,150,70,.5) 50%,rgba(255,106,19,0));mix-blend-mode:multiply;opacity:0}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 70%,rgba(0,0,0,.42) 100%);pointer-events:none}
#grain{position:absolute;inset:-40px;background:url(noise.png);opacity:.07;mix-blend-mode:overlay;pointer-events:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#flare{position:absolute;left:-300px;width:1680px;height:6px;margin-top:-3px;background:linear-gradient(90deg,rgba(255,150,60,0),rgba(255,170,90,.9) 50%,rgba(255,150,60,0));filter:blur(3px);opacity:0}
</style>
<body>
<div id="stage">
 <div id="glow"></div><div id="dust"></div>
 <div class="line" id="L1" style="top:170px;height:246px;font-size:210px"><span>看得见的</span></div>
 <div class="line" id="L2" style="top:416px;height:246px;font-size:210px"><span style="color:#ff6a13">肌肉恢复</span></div>
 <div id="cam"><div id="world"><div id="phone">
  <div id="body"></div>
  <div id="scr"><img id="s1"><div style="position:absolute;left:0;right:0;top:0;height:62px;background:#f2f2f7"></div>
   <div style="position:absolute;left:0;right:0;top:0;height:62px;padding:14px 38px 0 50px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:17px"><span>9:41</span><span id="bars"></span></div>
   <div style="position:absolute;left:138px;top:11px;width:126px;height:37px;border-radius:99px;background:#000"></div>
   <div id="dim"></div><div id="sheen"></div></div>
  <div id="cshadow"></div>
  <div id="card"><img id="s2"><img id="s3" class="gray"><div id="scan"></div><div id="rips"></div></div>
 </div></div></div>
 <div id="flare"></div>
 <div class="line" id="C1" style="top:1400px;height:92px;font-size:76px;letter-spacing:2px;font-weight:600;color:rgba(255,255,255,.78)"><span>练完的肌肉会染色</span></div>
 <div class="line" id="C2" style="top:1510px;height:166px;font-size:140px"><span>越狠，<b style="color:#ff6a13;font-weight:900">颜色越深</b></span></div>
 <div id="vig"></div><div id="grain"></div><div id="fade"></div>
</div>
<script>
const FPS=30, EV=[60,105,150], F_REST=40, F_END=185, SPEED=2.2, T_PLAY=4.6;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,t)=>a+(b-a)*t;
const eo=x=>1-Math.pow(1-clamp(x),4), eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}, eoE=x=>x>=1?1:1-Math.pow(2,-10*clamp(x));
const sm=x=>{x=clamp(x);return x*x*x*(x*(6*x-15)+10)};
// 机位关键帧：t, 平移(tx,ty), 绕X/Y转角, 缩放, 画面焦点(pt)
const K=[
 {t:0.0,tx:60,ty:1050,rx:30,ry:-38,s:1.00,cx:201,cy:437},
 {t:1.7,tx:0,ty:300,rx:12,ry:-14,s:1.16,cx:201,cy:437},
 {t:2.7,tx:0,ty:300,rx:5,ry:6,s:1.24,cx:201,cy:437},
 {t:3.7,tx:0,ty:-40,rx:0,ry:0,s:2.45,cx:201,cy:276},
 {t:6.9,tx:0,ty:-50,rx:0,ry:0,s:2.58,cx:201,cy:276},
 {t:8.0,tx:0,ty:-250,rx:10,ry:18,s:0.98,cx:201,cy:437},
 {t:8.8,tx:0,ty:-270,rx:12,ry:22,s:0.95,cx:201,cy:437}];
function cam(t){
 let i=0;while(i<K.length-2&&t>K[i+1].t)i++;
 const a=K[i],b=K[i+1],u=sm((t-a.t)/(b.t-a.t)),o={};
 for(const k of ['tx','ty','rx','ry','s','cx','cy'])o[k]=lerp(a[k],b[k],t<K[0].t?0:u);
 return o;
}
function barSvg(c,s){return `<svg width="${18*s}" height="${10*s}" viewBox="0 0 18 10" style="margin-right:6px"><g fill="${c}"><rect x="0" y="6.5" width="3" height="3.5" rx=".8"/><rect x="4.6" y="4.5" width="3" height="5.5" rx=".8"/><rect x="9.2" y="2.3" width="3" height="7.7" rx=".8"/><rect x="13.8" y="0" width="3" height="10" rx=".8"/></g></svg><svg width="${27*s}" height="${12*s}" viewBox="0 0 27 12"><rect x=".5" y=".5" width="22" height="11" rx="3.2" fill="none" stroke="${c}" opacity=".45"/><rect x="2" y="2" width="19" height="8" rx="2" fill="${c}"/><rect x="24" y="4" width="2" height="4" rx="1" fill="${c}" opacity=".5"/></svg>`}
const $=id=>document.getElementById(id);
$('bars').innerHTML=barSvg('#000',1);
// 尘埃（有深度的漂浮光点）
const dust=[];let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let i=0;i<46;i++){const e=document.createElement('i');const z=rnd();dust.push({e,x:rnd()*1080,y:rnd()*1920,z,ph:rnd()*6.28});e.style.width=e.style.height=(2+z*5)+'px';e.style.filter=`blur(${(1-z)*2.2}px)`;$('dust').appendChild(e);}
for(const ev of EV){const r=document.createElement('div');r.className='rip';r.style.left=(201-14)+'px';r.style.top=(123.8-40)+'px';$('rips').appendChild(r);}
// 事件的屏幕坐标
const EVPOS=[[201,123.8],[311.7,123.8],[90.3,123.8]];
const rips=[...document.querySelectorAll('.rip')];
rips.forEach((r,i)=>{r.style.left=(EVPOS[i][0]-16)+'px';r.style.top=(EVPOS[i][1]-48)+'px'});
function appFrame(t){return Math.floor(clamp(F_REST+Math.max(0,t-T_PLAY)*SPEED*FPS,F_REST,F_END))}
function evTime(f){return T_PLAY+(f-F_REST)/FPS/SPEED}
const pad=n=>String(n).padStart(5,'0');
let cur=-1;
async function setFrame(f){if(f===cur)return;cur=f;const u=`frames/muscle_j/${pad(f)}.jpg`;$('s1').src=u;$('s2').src=u;$('s3').src=u;try{await Promise.all([$('s1').decode(),$('s2').decode(),$('s3').decode()])}catch(e){}}
function reveal(id,t,t0,t1){const x=eoE((t-t0)/(t1-t0));$(id).firstElementChild.style.transform=`translateY(${(1-x)*115}%)`}
window.render=async function(t){
 await setFrame(appFrame(t));
 const c=cam(t);
 $('world').style.transform=`translate3d(${c.tx}px,${c.ty}px,0) rotateX(${c.rx}deg) rotateY(${c.ry}deg) scale(${c.s}) translate3d(${-c.cx}px,${-c.cy}px,0)`;
 // 卡片抬起
 const lift=eio((t-1.9)/1.0)*(1-eio((t-7.0)/0.8));
 $('card').style.transform=`translateZ(${lift*70}px)`;
 $('card').style.boxShadow=`0 0 0 .6px rgba(0,0,0,.08),0 ${8+lift*40}px ${20+lift*70}px rgba(0,0,0,${.18+lift*.3})`;
 $('cshadow').style.opacity=lift*.5;$('cshadow').style.transform=`translate(${lift*10}px,${lift*26}px) scale(${1+lift*.04})`;
 $('dim').style.opacity=lift*.6;
 // 玻璃反光：随转角扫过
 $('sheen').style.backgroundPosition=`${(-.3+((c.ry+40)/80)*1.6)*100}% 0`;
 // 点按
 rips.forEach((r,i)=>{const lt=t-evTime(EV[i]);const k=clamp(lt/.5);r.style.opacity=lt>=0&&lt<.5?(1-k)*.95:0;r.style.transform=`scale(${.4+k*1.4})`});
 // 标题
 reveal('L1',t,.25,.95);reveal('L2',t,.5,1.2);
 const out=clamp((t-2.3)/.6);
 for(const id of ['L1','L2']){$(id).style.opacity=1-out;$(id).style.filter=`blur(${out*14}px)`;$(id).style.transform=`translateY(${-out*60}px) scale(${1+out*.08})`}
 // 字幕
 reveal('C1',t,7.5,8.1);reveal('C2',t,7.7,8.4);
 // 染色：抬起时褪成灰，镜头到位后自上而下染回颜色
 const dye=eio((t-3.75)/.8), gray=eio((t-2.0)/.7)*(1-(dye>=1?1:0));
 $('s3').style.opacity=gray;$('s3').style.clipPath=`inset(${dye*100}% 0 0 0)`;
 $('scan').style.top=(dye*468)+'px';$('scan').style.opacity=dye>0&&dye<1?1:0;
 // 氛围
 $('glow').style.opacity=.55+.25*Math.sin(t*1.6)+.4*eo((t-1)/1);
 $('glow').style.transform=`translateY(${-lift*150}px)`;
 // 推镜时的横向光带
 const fl=Math.exp(-Math.pow((t-3.35)/.16,2));$('flare').style.top=(960+c.ty-300)+'px';$('flare').style.opacity=fl*.9;
 dust.forEach(d=>{const y=(d.y-t*(14+d.z*40)+1920*4)%1920,x=d.x+Math.sin(t*.6+d.ph)*20*d.z;d.e.style.transform=`translate(${x}px,${y}px)`;d.e.style.opacity=(.25+.6*d.z)*(.5+.5*Math.sin(t*1.3+d.ph))});
 // 胶片颗粒
 const g=Math.floor(t*FPS);$('grain').style.transform=`translate(${(g*37)%40}px,${(g*53)%40}px)`;
 $('fade').style.opacity=clamp((t-8.5)/.4)+clamp(1-(t)/.25);
};
window.render(0);
</script>
