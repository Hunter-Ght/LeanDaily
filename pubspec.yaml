name: leandaily
description: "薄肌日课 LeanDaily：按你的身材定制的薄肌训练与饮食记录 App。免费、开源、无广告，记录默认存本机，AI 识别需另行授权。"
publish_to: 'none'
version: 2.4.0+36

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  path_drawing: ^1.0.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  analyzer: ^10.1.0

flutter:
  uses-material-design: false
  fonts:
    - family: Wordmark
      fonts:
        - asset: assets/fonts/SmileySans-Wordmark.ttf
    # 数字读数：Barlow Semi Condensed（SIL OFL 1.1），紧凑、等宽数字，训练中一臂远也看得清。
    - family: Numeral
      fonts:
        - asset: assets/fonts/BarlowSemiCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowSemiCondensed-Bold.ttf
          weight: 700
  assets:
    - assets/motion3d/
    - assets/legal/
    - assets/fonts/Barlow-OFL.txt
    - assets/l10n/
    - assets/state.json
    - assets/foods.json
    - assets/muscle_map.json
